
name: ShopWatch Apps

on:
  push:
    branches:
      - ShopWatch-Admin-Client-Windows
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: android-client
            name: ShopWatch-Client-APK
          - dir: android-admin
            name: ShopWatch-Admin-APK

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ matrix.dir }}
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

 
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: admin-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify project folder
        run: |
          if (!(Test-Path "package.json")) {
            Write-Error "package.json not found in admin-desktop"
            exit 1
          }

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ShopWatch-Admin-Windows-Installer
          path: admin-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

