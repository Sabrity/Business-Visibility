name: ShopWatch Apps

on:
  push:
    branches:
      - ShopWatch-Admin-Client-Windows
  workflow_dispatch:

jobs:
  android-client:
    name: Build ShopWatch Client APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Client APK
        working-directory: android-client
        run: gradle :app:assembleDebug

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopWatch-Client-APK
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-admin:
    name: Build ShopWatch Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Admin APK
        working-directory: android-admin
        run: gradle :app:assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopWatch-Admin-APK
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-admin:
    name: Build ShopWatch Admin Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: admin-desktop
        run: npm install

      - name: Build Windows installer
        working-directory: admin-desktop
        run: npm run dist

      - name: Verify installer
        shell: pwsh
        working-directory: admin-desktop
        run: |
          $installers = Get-ChildItem "dist" -Filter "*.exe" -File

          if ($installers.Count -eq 0) {
            Write-Error "No Windows installer was generated."
            exit 1
          }

          $installers | ForEach-Object {
            Write-Host "Installer generated: $($_.FullName)"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ShopWatch-Admin-Windows-Installer
          path: admin-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
