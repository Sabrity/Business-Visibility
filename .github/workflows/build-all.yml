name: ShopWatch Apps
on:
  push:
    branches:
      - ShopWatch-Admin-Client-Windows
  workflow_dispatch:
jobs:
  android-client:
    name: Build ShopWatch Client APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Client APK
        working-directory: Client App/android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShopWatch-Client-APK
          path: Client App/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-admin:
    name: Build ShopWatch Admin APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Admin APK
        working-directory: android-admin
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShopWatch-Admin-APK
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-admin:
    name: Build ShopWatch Admin Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Verify installer
        shell: pwsh
        run: |
          $installers = Get-ChildItem "dist" -Filter "*.exe" -File
          if ($installers.Count -eq 0) {
            Write-Error "No Windows installer was generated."
            exit 1
          }
          $installers | ForEach-Object { Write-Host "Installer generated: $($_.FullName)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ShopWatch-Admin-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
