name: Build Admin App APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'admin/**'
      - 'android-admin/**'
      - '.github/workflows/build-admin-apk.yml'
permissions:
  contents: read
jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Sync Admin App HTML into Android package
        run: cp admin/index.html android-admin/app/src/main/assets/index.html
      - name: Build Admin APK
        working-directory: android-admin
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Trader-Business-Control-Admin-APK
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
