name: Build Client App APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Client App/**'
      - '.github/workflows/build-client-apk.yml'
permissions:
  contents: read
jobs:
  build-client-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Sync current Client App HTML into Android package
        run: cp 'Client App/index.html' 'Client App/android/app/src/main/assets/index.html'
      - name: Build Client APK
        working-directory: Client App/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShopWatch-Client-APK
          path: 'Client App/android/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 30
